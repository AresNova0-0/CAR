<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết xe — LuxeCar</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="logo" href="/">♜ LUXE<span>CAR</span></a><nav><a href="/">Trang chủ</a><a href="/cars.html">Tất cả xe</a><a href="/brands.html">Thương hiệu</a><a href="/services.html">Dịch vụ</a><a href="/contact.html">Liên hệ</a></nav><div class="navright"><button onclick="location.href='/checkout.html'">🛒 <b id="cartCount">0</b></button></div></header><main class="detail detailLuxury" id="detail"></main>
<section class="content vehicleDetailContent" id="vehicleDetail"></section>
<footer>LUXECAR · Luxury Automotive House</footer><script src="/data.js"></script><script src="/richdata.js"></script><script src="/app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{
 const id=new URLSearchParams(location.search).get('id');
 const c=CARS.find(x=>x.id===id)||CARS[0];
 document.title=c.brand+' '+c.name+' — LuxeCar';
 const labels={country:'Quốc gia',founded:'Năm thành lập',hq:'Trụ sở',legal:'Pháp nhân',focus:'Lĩnh vực',note:'Định vị',modelYear:'Đời xe',productionPeriod:'Giai đoạn',specificDate:'Ngày sản xuất mẫu xe',vin:'Xác minh VIN',status:'Trạng thái',modelLaunch:'Ra mắt mẫu',vehicleBuildDate:'Ngày xuất xưởng thực tế',productionTrace:'Chuỗi xác minh',body:'Kiểu thân xe',overall:'Hình dáng tổng thể',materials:'Vật liệu',aero:'Khí động học',layout:'Bố trí',powertrain:'Hệ truyền động',transmission:'Hộp số',chassis:'Khung gầm',suspension:'Hệ thống treo',brakes:'Phanh',wheels:'Mâm/lốp',electronics:'Điện tử',cabin:'Khoang cabin',length:'Chiều dài',width:'Chiều rộng',height:'Chiều cao',wheelbase:'Chiều dài cơ sở',weight:'Khối lượng'};
 const esc=x=>String(x??'').replaceAll('\\','&#92;').replaceAll('`','&#96;');
 const specs=`<div class="specs"><div><b>Năm / đời xe</b>${esc(c.year)}</div><div><b>Động cơ</b>${esc(c.engine)}</div><div><b>Công suất</b>${esc(c.power)}</div><div><b>Mô-men xoắn</b>${esc(c.torque)}</div><div><b>0–100 km/h</b>${esc(c.zero)}</div><div><b>Tốc độ tối đa</b>${esc(c.top)}</div><div><b>Dẫn động</b>${esc(c.drive)}</div></div>`;
 document.getElementById('detail').innerHTML=`<div class="detailImage" style="background-image:url('${c.img}')"><span class="imageBadge">${esc(c.brand)}</span></div><div class="detailInfo"><small>${esc(c.brand).toUpperCase()} · ${esc(c.type).toUpperCase()}</small><h1>${esc(c.name)}</h1><p class="desc">${esc(c.desc)}</p><div class="detailTag">HỒ SƠ XE · TECHNICAL DOSSIER</div>${specs}<div class="detailActions"><button class="btn" onclick="addCart('${c.id}')">THÊM VÀO GIỎ</button><a class="ghost" href="${c.official}" target="_blank" rel="noopener">TRANG CHÍNH HÃNG ↗</a></div></div>`;
 const block=(title,obj)=>`<section class="infoBlock"><div class="blockHead"><small>${title}</small><h2>${title}</h2></div><div class="specTable">${Object.entries(obj||{}).map(([k,v])=>`<div><b>${labels[k]||k}</b><span>${esc(v)}</span></div>`).join('')}</div></section>`;
 const gallery=(c.gallery||[]).map(([title,url])=>`<figure class="galleryItem"><img src="${url}" alt="${esc(c.name)} — ${esc(title)}" loading="lazy"><figcaption><b>${esc(title)}</b><span>${title.includes('tham khảo')?'Ảnh tham khảo kỹ thuật':'Hình ảnh mẫu'}</span></figcaption></figure>`).join('');
 document.getElementById('vehicleDetail').innerHTML=`
 <div class="detailNav"><a href="#gallery">01 / Hình ảnh</a><a href="#production">02 / Sản xuất</a><a href="#engineering">03 / Kỹ thuật</a><a href="#design">04 / Thiết kế</a><a href="#verification">05 / Xác minh</a></div>
 <section id="gallery" class="detailSection"><div class="sectionTitle"><small>VISUAL ARCHIVE</small><h2>Hình ảnh xe & các chi tiết</h2><p>Góc nhìn trực quan của mẫu xe. Ảnh được ghi rõ là ảnh mẫu hoặc ảnh tham khảo khi không phải ảnh chính hãng.</p></div><div class="vehicleGallery">${gallery}</div><a class="officialLink" href="${c.official}" target="_blank" rel="noopener">Xem thư viện & thông tin chính hãng của ${esc(c.brand)} ↗</a></section>
 <section id="production" class="detailSection"><div class="sectionTitle"><small>PROVENANCE</small><h2>Sản xuất & ngày xuất xưởng</h2></div>${block('NHÀ SẢN XUẤT',c.manufacturer)}${block('SẢN XUẤT & NGUỒN GỐC',c.production)}<div class="productionCard"><b>Ngày sản xuất thật của chiếc xe</b><p>${esc(c.production.vehicleBuildDate)}</p><strong>Quy trình xác minh:</strong><p>${esc(c.production.productionTrace)}</p></div></section>
 <section id="engineering" class="detailSection"><div class="sectionTitle"><small>ENGINEERING</small><h2>Linh kiện & hệ thống kỹ thuật</h2></div>${block('LINH KIỆN & CẤU PHẦN',c.components)}${block('KÍCH THƯỚC & TRỌNG LƯỢNG',c.dimensions)}<div class="componentStrip"><article><img src="${TECH_IMAGES.engine}" alt="Hình minh họa hệ truyền động"><b>Hệ truyền động</b><span>Ảnh minh họa kỹ thuật</span></article><article><img src="${TECH_IMAGES.interior}" alt="Hình minh họa khoang nội thất"><b>Khoang nội thất</b><span>Ảnh minh họa kỹ thuật</span></article><article><img src="${TECH_IMAGES.wheel}" alt="Hình minh họa mâm xe"><b>Mâm & lốp</b><span>Ảnh minh họa kỹ thuật</span></article><article><img src="${TECH_IMAGES.brake}" alt="Hình minh họa hệ thống phanh"><b>Phanh & cơ cấu bánh</b><span>Ảnh minh họa kỹ thuật</span></article></div></section>
 <section id="design" class="detailSection"><div class="sectionTitle"><small>DESIGN LANGUAGE</small><h2>Thiết kế & hình dáng tổng thể</h2></div>${block('THIẾT KẾ & HÌNH DÁNG',c.design)}</section>
 <section id="verification" class="detailSection"><div class="sectionTitle"><small>AUTHENTICITY</small><h2>Thông tin xác minh</h2></div><div class="verifyGrid"><article><b>Trang chính hãng</b><p>Đối chiếu thông số, hình ảnh và cấu hình tại nguồn của nhà sản xuất.</p><a class="officialLink" href="${c.official}" target="_blank" rel="noopener">Mở trang chính hãng ↗</a></article><article><b>Ngày sản xuất</b><p>Không coi năm model là ngày xuất xưởng. Ngày thật phải lấy từ VIN/CoC/hồ sơ nhà máy hoặc đại lý ủy quyền.</p></article><article><b>Hình ảnh</b><p>Ảnh có nhãn “ảnh tham khảo” không được dùng làm bằng chứng về cấu hình của một chiếc xe cụ thể.</p></article></div></section>
 <section class="notice"><h2>Lưu ý dữ liệu</h2><p>LuxeCar ưu tiên thông tin có thể kiểm chứng. Thông số có thể thay đổi theo thị trường, model year và option. Đối với một chiếc xe cụ thể, VIN và hồ sơ nhà sản xuất/đại lý là nguồn xác minh cuối cùng.</p></section>`;
});
</script></body></html>
